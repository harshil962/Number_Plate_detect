<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Plate Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy: #0d1f4e;
            --blue: #1a3a8f;
            --accent: #4f8ef7;
            --bright: #72b4ff;
            --plate-yellow: #f5c842;
            --card-bg: rgba(255,255,255,0.05);
            --glass: rgba(255,255,255,0.08);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--navy);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 1rem;
        }

        /* Animated mesh background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 20%, rgba(79,142,247,0.18) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 80%, rgba(26,58,143,0.25) 0%, transparent 60%),
                radial-gradient(ellipse 40% 40% at 60% 10%, rgba(114,180,255,0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Grid overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(79,142,247,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79,142,247,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .page-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
        }

        /* Plate badge at top */
        .plate-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 1.5rem;
            animation: slideDown 0.6s ease both;
        }

        .plate-chip {
            background: var(--plate-yellow);
            color: var(--navy);
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(0.7rem, 2.5vw, 0.85rem);
            font-weight: 700;
            letter-spacing: 0.2em;
            padding: 4px 14px;
            border-radius: 4px;
            border: 2px solid rgba(0,0,0,0.15);
            box-shadow: 0 2px 12px rgba(245,200,66,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
            text-transform: uppercase;
        }

        .plate-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(79,142,247,0.4), transparent);
        }

        /* Main card */
        .detect-card {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: clamp(1.5rem, 6vw, 2.5rem);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 32px 64px rgba(0,0,0,0.4),
                0 0 0 1px rgba(255,255,255,0.05) inset,
                0 1px 0 rgba(255,255,255,0.15) inset;
            animation: fadeUp 0.7s ease 0.1s both;
        }

        /* Header */
        .card-header-area {
            text-align: center;
            margin-bottom: 2rem;
        }

        .icon-ring {
            width: clamp(56px, 15vw, 72px);
            height: clamp(56px, 15vw, 72px);
            background: linear-gradient(135deg, var(--accent), var(--bright));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: clamp(1.4rem, 5vw, 1.8rem);
            box-shadow: 0 8px 24px rgba(79,142,247,0.4);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 24px rgba(79,142,247,0.4); }
            50% { box-shadow: 0 8px 32px rgba(79,142,247,0.7), 0 0 0 8px rgba(79,142,247,0.08); }
        }

        .card-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(1.5rem, 6vw, 2rem);
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.05em;
            margin-bottom: 0.3rem;
        }

        .card-subtitle {
            font-size: clamp(0.8rem, 3vw, 0.9rem);
            color: rgba(255,255,255,0.45);
            font-weight: 300;
        }

        /* Drop zone */
        .drop-zone {
            border: 2px dashed rgba(79,142,247,0.35);
            border-radius: 14px;
            padding: clamp(1.5rem, 6vw, 2.5rem) 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(79,142,247,0.04);
            position: relative;
            overflow: hidden;
            margin-bottom: 1.25rem;
        }

        .drop-zone::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(79,142,247,0.08), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent);
            background: rgba(79,142,247,0.08);
        }

        .drop-zone:hover::before, .drop-zone.dragover::before {
            opacity: 1;
        }

        .drop-icon {
            font-size: clamp(1.8rem, 7vw, 2.5rem);
            margin-bottom: 0.75rem;
            display: block;
            opacity: 0.7;
        }

        .drop-text {
            color: rgba(255,255,255,0.6);
            font-size: clamp(0.8rem, 3vw, 0.9rem);
        }

        .drop-text strong {
            color: var(--bright);
            cursor: pointer;
        }

        .drop-text strong:hover { text-decoration: underline; }

        .drop-hint {
            font-size: clamp(0.7rem, 2.5vw, 0.78rem);
            color: rgba(255,255,255,0.3);
            margin-top: 0.5rem;
        }

        /* Hide default file input, use drop zone instead */
        .file-input-real {
            display: none;
        }

        /* Preview */
        #preview-wrap {
            display: none;
            margin-bottom: 1.25rem;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        #preview-img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            display: block;
        }

        .preview-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(13,31,78,0.85));
            padding: 1rem 0.75rem 0.5rem;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.7);
        }

        #file-name {
            font-weight: 500;
            color: #fff;
        }

        .remove-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.5);
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            color: #fff;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .remove-btn:hover { background: rgba(220,50,50,0.7); }

        /* Submit button */
        .btn-detect {
            width: 100%;
            padding: clamp(0.75rem, 3vw, 0.9rem) 1rem;
            background: linear-gradient(135deg, var(--accent), #2d6ee0);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(1rem, 4vw, 1.1rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(79,142,247,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-detect:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(79,142,247,0.5);
            background: linear-gradient(135deg, #6aa3ff, var(--accent));
        }

        .btn-detect:active {
            transform: translateY(0);
        }

        /* Divider */
        .or-divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.25rem 0;
        }

        .or-divider span {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.3);
            white-space: nowrap;
            letter-spacing: 0.05em;
        }

        .or-divider::before, .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.08);
        }

        /* Feature chips */
        .features {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .feature-chip {
            font-size: clamp(0.68rem, 2.5vw, 0.75rem);
            color: rgba(255,255,255,0.45);
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 3px 10px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Animations */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Responsive tweaks */
        @media (max-width: 400px) {
            .detect-card { border-radius: 16px; }
            .features { gap: 0.35rem; }
        }

        @media (min-width: 768px) {
            .drop-zone { padding: 3rem 2rem; }
        }
    </style>
</head>
<body>

<div class="page-wrapper">

    <!-- Plate badge decoration -->
    <div class="plate-badge">
        <div class="plate-line"></div>
        <div class="plate-chip">ANPR System</div>
        <div class="plate-line"></div>
    </div>

    <!-- Main card -->
    <div class="detect-card">

        <div class="card-header-area">
            <div class="icon-ring">🚘</div>
            <h1 class="card-title">Plate Detection</h1>
            <p class="card-subtitle">Upload a vehicle image to extract the number plate</p>
        </div>

        <form method="POST" action="/detect/" enctype="multipart/form-data" id="detect-form">
            {% csrf_token %}

            <!-- Hidden real file input -->
            <input type="file" name="image" id="image-input" class="file-input-real" accept="image/*">

            <!-- Drop Zone -->
            <div class="drop-zone" id="drop-zone">
                <span class="drop-icon">📸</span>
                <p class="drop-text">
                    Drag &amp; drop your image here, or
                    <strong onclick="document.getElementById('image-input').click()">browse</strong>
                </p>
                <p class="drop-hint">JPG, PNG, WEBP &nbsp;·&nbsp; Max 10 MB</p>
            </div>

            <!-- Preview -->
            <div id="preview-wrap">
                <img id="preview-img" src="" alt="Preview">
                <div class="preview-label">Selected: <span id="file-name"></span></div>
                <button type="button" class="remove-btn" id="remove-btn" title="Remove">✕</button>
            </div>

            <div class="or-divider"><span>Ready to analyse</span></div>

            <button type="submit" class="btn-detect">
                🔍 Detect Plate
            </button>
        </form>

        <div class="features">
            <span class="feature-chip">⚡ Fast OCR</span>
            <span class="feature-chip">🌐 Multi-region</span>
            <span class="feature-chip">🔒 Secure</span>
            <span class="feature-chip">📱 Mobile-ready</span>
        </div>

    </div>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('image-input');
    const previewWrap = document.getElementById('preview-wrap');
    const previewImg = document.getElementById('preview-img');
    const fileName = document.getElementById('file-name');
    const removeBtn = document.getElementById('remove-btn');

    function showPreview(file) {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = e => {
            previewImg.src = e.target.result;
            fileName.textContent = file.name;
            previewWrap.style.display = 'block';
            dropZone.style.display = 'none';
        };
        reader.readAsDataURL(file);
    }

    function resetUpload() {
        fileInput.value = '';
        previewImg.src = '';
        previewWrap.style.display = 'none';
        dropZone.style.display = 'block';
    }

    fileInput.addEventListener('change', () => {
        if (fileInput.files[0]) showPreview(fileInput.files[0]);
    });

    removeBtn.addEventListener('click', resetUpload);

    // Drag & drop
    ['dragenter', 'dragover'].forEach(ev => {
        dropZone.addEventListener(ev, e => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
    });

    ['dragleave', 'drop'].forEach(ev => {
        dropZone.addEventListener(ev, e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        });
    });

    dropZone.addEventListener('drop', e => {
        const file = e.dataTransfer.files[0];
        if (file) {
            const dt = new DataTransfer();
            dt.items.add(file);
            fileInput.files = dt.files;
            showPreview(file);
        }
    });

    dropZone.addEventListener('click', () => fileInput.click());
</script>

</body>
</html>
